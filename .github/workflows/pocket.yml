name: Muse Pocket 中文版

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Public tree and history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/check_public_tree.py
      - name: Focused tests
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python -m pip install 'cryptography==46.0.6'
          python -m unittest discover -s esp32/tools/pocket -p 'test_*.py' -v
      - name: Embedded Chinese font checks
        run: python3 -m unittest discover -s tools/fonts -p 'test_*.py' -v
      - name: Build X4 Pro without credentials
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          esp32/tools/pocket/build.sh
      - name: SDK host tests
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libmbedtls-dev pkg-config
          source "$IDF_PATH/export.sh"
          cd esp32
          python -m unittest discover -s tests -p 'test_*.py' -v

  crossmux-patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned CrossMux patch and run host regressions
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang libssl-dev
          mkdir -p "$RUNNER_TEMP/host-bin"
          ln -s "$(command -v clang++)" "$RUNNER_TEMP/host-bin/c++"
          export PATH="$RUNNER_TEMP/host-bin:$PATH"
          git clone --no-checkout https://github.com/0x1abin/crossmux.git "$RUNNER_TEMP/crossmux"
          git -C "$RUNNER_TEMP/crossmux" checkout --detach 1512e8e049f2b1a4efc7c004a5b1a93cbc5e3f9f
          python3 integrations/crossmux/verify_patch.py "$RUNNER_TEMP/crossmux" --apply
          cd "$RUNNER_TEMP/crossmux"
          CXX=clang++ python3 -m unittest discover -s scripts/tests -p 'test_muse_coexist*.py' -v
