# Only reviewed public SDK fixtures are excluded; actual Muse tokens are not.
[extend]
useDefault = true

[[allowlists]]
description = "Deliberately public SDK development key; SHA256 pinned by check_public_tree.py"
targetRules = ["private-key"]
paths = ['^esp32/dev_signing_key\.pem$']

[[allowlists]]
description = "RFC WebSocket sample nonce in inherited upgrade request templates"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^esp32/main/noise_upgrade\.h$', '^esp32/components/muse/muse_chat_session\.cpp$']
regexTarget = "match"
regexes = ['Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==']

[[allowlists]]
description = "Exact public pairing test vectors derived from the documented small test scalars"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^esp32/tests/vectors/link_pairing_v5\.json$']
regexTarget = "line"
regexes = [
  '''"ecdh_secret_hex": "7cf27b188d034f7e8a52380304b51ac3c08969e277f21b35a60b48fc47669978"''',
